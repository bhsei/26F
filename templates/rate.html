<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rate {{ rated_role }} - CampusShare</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body class="dashboard-body">

<header class="dashboard-navbar">

    <div class="logo">
        CampusShare
    </div>

    <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/browse">Browse</a>
        <a href="/my-rentals">My Rentals</a>
        <form method="POST" action="/logout" style="display: inline;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" style="background: none; border: 0; color: inherit; font: inherit; cursor: pointer;">Logout</button>
        </form>
    </nav>

</header>


<main class="list-item-container">

    <div class="list-item-heading">

        <p class="small-text">
            RENTAL FEEDBACK
        </p>

        <h1>Rate {{ rated_role }}</h1>

        <p>
            Rate your experience with {{ rated_user_name }}.
        </p>

    </div>


    <form
        method="POST"
        class="equipment-form"
    >
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="rating">
            Rating
        </label>

        <select
            id="rating"
            name="rating"
            required
        >
            <option value="">
                Select rating
            </option>

            <option value="5">
                ⭐⭐⭐⭐⭐ Excellent
            </option>

            <option value="4">
                ⭐⭐⭐⭐ Very Good
            </option>

            <option value="3">
                ⭐⭐⭐ Good
            </option>

            <option value="2">
                ⭐⭐ Fair
            </option>

            <option value="1">
                ⭐ Poor
            </option>

        </select>


        <label for="comment">
            Comment
        </label>

        <textarea
            id="comment"
            name="comment"
            rows="5"
            placeholder="Write a short comment about your experience."
        ></textarea>


        <button
            type="submit"
            class="dashboard-main-button equipment-submit"
        >
            Submit Rating
        </button>

    </form>

</main>

</body>

</html>
