<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students | CampusShare</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<header>
    <nav>
        <h1>CampusShare</h1>

        <div>
            <a href="/dashboard">Dashboard</a>
            <a href="/browse">Browse</a>
            <a href="/list-item">List Item</a>
            <a href="/students">Students</a>
            <a href="/requests">Requests</a>
            <form method="POST" action="/logout" style="display: inline;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" style="background: none; border: 0; color: inherit; font: inherit; cursor: pointer;">Logout</button>
            </form>
        </div>
    </nav>
</header>

<main style="max-width: 1100px; margin: 0 auto; padding: 50px 30px;">

    <div style="text-align: center; margin-bottom: 40px;">
        <p style="font-weight: bold; letter-spacing: 2px;">
            CAMPUS COMMUNITY
        </p>

        <h1>Students</h1>

        <p>
            Connect and communicate with other CampusShare students.
        </p>
    </div>

    <div class="equipment-grid">

        {% for student in students %}

        <div class="equipment-card">

            <div style="font-size: 42px; margin-bottom: 15px;">
                👤
            </div>

            <h2>{{ student[1] }}</h2>

            <p>
                CampusShare Student
            </p>

            <a
                href="/chat/{{ student[0] }}"
                class="dashboard-main-button"
            >
                💬 Message
            </a>

        </div>

        {% else %}

        <div class="empty-message">
            No other students are registered yet.
        </div>

        {% endfor %}

    </div>

</main>

</body>

</html>
