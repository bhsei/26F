<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | CampusShare</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<div class="register-container">

    

        <h1>Forgot Password</h1>

  <p class="register-text">
    Enter your Beihang University email address.
</p>

        {% if message %}

        <div style="
            background: #eef4ff;
            border: 1px solid #c7d7f2;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #24436b;
        ">
            {{ message }}
        </div>

        {% endif %}

        <form method="POST">
           <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

           <label
    for="email"
    style="
        display: block;
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 8px;
    "
>
    Beihang University Email
</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="yourname@buaa.edu.cn"
                required
            >

            <button type="submit" class="primary-button">Reset Password</button>
            
            

        </form>

        <p style="margin-top: 20px;">
            Remember your password?
            <a href="/login">Back to Login</a>
        </p>

    

</div>

</body>

</html>
