<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resend Verification - CampusShare</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main class="register-container">
    <h1>Resend Verification</h1>
    <p class="register-text">Enter your university email to request a new verification link.</p>
    <form method="POST" action="{{ url_for('resend_verification') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="email">University Email</label>
        <input type="email" id="email" name="email" required>
        <button type="submit" class="primary-button">Send Verification Link</button>
    </form>
    <p class="login-link"><a href="{{ url_for('login') }}">Return to login</a></p>
</main>
</body>
</html>
